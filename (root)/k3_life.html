<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>K3's Simulation of Life</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #00e676; }
    p { margin-top: 0; color: #aaa; font-size: 14px; }
    #canvas-container {
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 15px;
    }
    canvas { display: block; background-color: #000; cursor: pointer; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button, select {
      background-color: #1f1f1f;
      color: #00e676;
      border: 1px solid #00e676;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    button:hover, select:hover { background-color: #00e676; color: #121212; }
    .stats {
      font-family: monospace;
      font-size: 14px;
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 5px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

  <h1>K3's Simulation of Life</h1>
  <p>Click or drag on the grid to draw cells manually!</p>

  <div class="controls">
    <button onclick="togglePause()" id="pauseBtn">Resume</button>
    <button onclick="clearGrid()">Clear Grid</button>
    <select id="spawnType">
      <option value="prey">Spawn Prey Cell</option>
      <option value="predator">Spawn Predator Cell</option>
    </select>
  </div>

  <div id="canvas-container">
    <canvas id="gridCanvas" width="800" height="600"></canvas>
  </div>

  <div class="stats">
    <div>Generations: <span id="genCount">0</span></div>
    <div>Prey: <span id="preyCount">0</span></div>
    <div>Predators: <span id="predCount">0</span></div>
  </div>

<script>
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const CELL_SIZE = 10;
const COLS = CANVAS_WIDTH / CELL_SIZE;
const ROWS = CANVAS_HEIGHT / CELL_SIZE;

const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

let grid = createGrid();
let generation = 0;
let isPaused = true; // Paused by default so you can draw first
let isMouseDown = false;

class Cell {
  constructor(role = 'prey', genome = null) {
    this.role = role; 
    this.gender = this.assignGender();
    this.age = 0; 
    this.stepsSinceEaten = 0; 
    this.genome = genome || this.generateGenome(); 
  }

  assignGender() {
    const genders = ['XY', 'XX', 'YX', 'YY'];
    return genders[Math.floor(Math.random() * genders.length)];
  }

  generateGenome() {
    const bases = ['A', 'T', 'G', 'C'];
    let seqs = [];
    for (let i = 0; i < 100; i++) {
      let seq = '';
      for (let j = 0; j < 4; j++) seq += bases[Math.floor(Math.random() * 4)];
      seqs.push(seq);
    }
    return seqs;
  }

  getColor() {
    if (this.role === 'predator') {
      return this.age === 0 ? '#ff1744' : (this.age === 1 ? '#d50000' : '#880e4f');
    }
    if (this.gender === 'XY') return this.age === 0 ? '#ffff8d' : (this.age === 1 ? '#bcaaa4' : '#ff5252');
    if (this.gender === 'XX') return this.age === 0 ? '#80d8ff' : (this.age === 1 ? '#40c4ff' : '#448aff');
    if (this.gender === 'YX') return this.age === 0 ? '#b9f6ca' : (this.age === 1 ? '#69f0ae' : '#00c853');
    if (this.gender === 'YY') return this.age === 0 ? '#ea80fc' : (this.age === 1 ? '#e040fb' : '#aa00ff');
  }
}

function createGrid() {
  let g = new Array(ROWS);
  for (let r = 0; r < ROWS; r++) {
    g[r] = new Array(COLS).fill(null);
  }
  return g;
}

// Fixed neighbor count function
function getNeighborCount(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      let nr = r + dr;
      let nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (grid[nr][nc] !== null) {
          count++;
        }
      }
    }
  }
  return count;
}

function updateWorld() {
  if (isPaused) return;

  let nextGrid = createGrid();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let currentCell = grid[r][c];

      if (currentCell) {
        let neighborCount = getNeighborCount(r, c);

        // Rule 3: STRICT Overcrowding Check (Dies ONLY if 4 or more neighbors)
        if (neighborCount >= 4) continue; 

        // Rule 4: Isolation Pair Check
        if (neighborCount === 1) {
          // Check if isolated pair
          let isPairIsolated = false;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc]) {
                if (getNeighborCount(nr, nc) === 1) isPairIsolated = true;
              }
            }
          }
          if (isPairIsolated) continue; 
        }

        // Rule 9: Predator Starvation (Max 30 moves)
        if (currentCell.role === 'predator') {
          currentCell.stepsSinceEaten++;
          if (currentCell.stepsSinceEaten >= 30) continue;
        }

        // Rule 6: Lifecycle Transitions
        if (generation % 20 === 0 && currentCell.age < 2) {
          currentCell.age++;
        }

        // Rule 7 & 9: Movement & Feeding
        let moved = false;
        if (Math.random() < 0.5) {
          let dr = Math.floor(Math.random() * 3) - 1;
          let dc = Math.floor(Math.random() * 3) - 1;
          let nr = r + dr, nc = c + dc;

          if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
            let target = grid[nr][nc];
            if (currentCell.role === 'predator' && target && target.role === 'prey') {
              currentCell.stepsSinceEaten = 0;
              nextGrid[nr][nc] = currentCell;
              moved = true;
            } else if (!target && !nextGrid[nr][nc]) {
              nextGrid[nr][nc] = currentCell;
              moved = true;
            }
          }
        }

        if (!moved && !nextGrid[r][c]) {
          nextGrid[r][c] = currentCell;
        }

      } else {
        // Rule 2: Reproduction on exact horizontal 1-tile gap
        if (c > 0 && c < COLS - 1) {
          let left = grid[r][c - 1];
          let right = grid[r][c + 1];

          if (left && right && left.role === 'prey' && right.role === 'prey') {
            let childGenome = left.genome.map((seq, i) => Math.random() > 0.5 ? seq : right.genome[i]);
            nextGrid[r][c] = new Cell('prey', childGenome);
          }
        }
      }
    }
  }

  grid = nextGrid;
  generation++;
  render();
}

function render() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  let prey = 0;
  let pred = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let cell = grid[r][c];
      if (cell) {
        ctx.fillStyle = cell.getColor();
        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
        if (cell.role === 'prey') prey++;
        if (cell.role === 'predator') pred++;
      }
    }
  }

  document.getElementById('genCount').innerText = generation;
  document.getElementById('preyCount').innerText = prey;
  document.getElementById('predCount').innerText = pred;
}

// Interactive Drawing (Click / Click & Drag)
function placeCell(event) {
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const c = Math.floor(x / CELL_SIZE);
  const r = Math.floor(y / CELL_SIZE);

  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
    const role = document.getElementById('spawnType').value;
    grid[r][c] = new Cell(role);
    render();
  }
}

canvas.addEventListener('mousedown', (e) => {
  isMouseDown = true;
  placeCell(e);
});

canvas.addEventListener('mousemove', (e) => {
  if (isMouseDown) placeCell(e);
});

window.addEventListener('mouseup', () => {
  isMouseDown = false;
});

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('pauseBtn').innerText = isPaused ? 'Resume' : 'Pause';
}

function clearGrid() {
  grid = createGrid();
  generation = 0;
  render();
}

render();
setInterval(updateWorld, 100);
</script>

</body>
</html>
