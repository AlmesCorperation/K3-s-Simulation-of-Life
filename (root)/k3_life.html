<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>K3's Simulation of Life</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #00e676; }
    p { margin-top: 0; color: #aaa; font-size: 14px; }
    #canvas-container {
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 15px;
    }
    canvas { display: block; background-color: #000; cursor: pointer; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button, select {
      background-color: #1f1f1f;
      color: #00e676;
      border: 1px solid #00e676;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    button:hover, select:hover { background-color: #00e676; color: #121212; }
    .stats {
      font-family: monospace;
      font-size: 14px;
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 5px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

  <h1>K3's Simulation of Life</h1>
  <p>Rule 7: Tactical Evolutionary Movement (Evasion, Herd Joining, Threat Escape)</p>

  <div class="controls">
    <button onclick="togglePause()" id="pauseBtn">Resume</button>
    <button onclick="clearGrid()">Clear Grid</button>
    <select id="spawnType">
      <option value="prey">Spawn Prey Cell</option>
      <option value="predator">Spawn Predator Cell</option>
    </select>
  </div>

  <div id="canvas-container">
    <canvas id="gridCanvas" width="800" height="600"></canvas>
  </div>

  <div class="stats">
    <div>Generations: <span id="genCount">0</span></div>
    <div>Prey: <span id="preyCount">0</span></div>
    <div>Predators: <span id="predCount">0</span></div>
  </div>

<script>
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const CELL_SIZE = 10;
const COLS = CANVAS_WIDTH / CELL_SIZE;
const ROWS = CANVAS_HEIGHT / CELL_SIZE;

const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

let grid = createGrid();
let generation = 0;
let isPaused = true;
let isMouseDown = false;

class Cell {
  constructor(role = 'prey', genome = null) {
    this.role = role; 
    this.gender = this.assignGender();
    this.age = 0; 
    this.stepsSinceEaten = 0; 
    this.genome = genome || this.generateGenome(); // Pure ATGC DNA
  }

  assignGender() {
    const genders = ['XY', 'XX', 'YX', 'YY'];
    return genders[Math.floor(Math.random() * genders.length)];
  }

  // Rule 8: 100 Sequences of ATGC Bases (Pure Genetic DNA)
  generateGenome() {
    const bases = ['A', 'T', 'G', 'C'];
    let seqs = [];
    for (let i = 0; i < 100; i++) {
      let seq = '';
      for (let j = 0; j < 4; j++) seq += bases[Math.floor(Math.random() * 4)];
      seqs.push(seq);
    }
    return seqs;
  }

  getColor() {
    if (this.role === 'predator') {
      return this.age === 0 ? '#ff1744' : (this.age === 1 ? '#d50000' : '#880e4f');
    }
    if (this.gender === 'XY') return this.age === 0 ? '#ffff8d' : (this.age === 1 ? '#bcaaa4' : '#ff5252');
    if (this.gender === 'XX') return this.age === 0 ? '#80d8ff' : (this.age === 1 ? '#40c4ff' : '#448aff');
    if (this.gender === 'YX') return this.age === 0 ? '#b9f6ca' : (this.age === 1 ? '#69f0ae' : '#00c853');
    if (this.gender === 'YY') return this.age === 0 ? '#ea80fc' : (this.age === 1 ? '#e040fb' : '#aa00ff');
  }
}

function createGrid() {
  let g = new Array(ROWS);
  for (let r = 0; r < ROWS; r++) {
    g[r] = new Array(COLS).fill(null);
  }
  return g;
}

function getNeighborCount(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      let nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (grid[nr][nc] !== null) count++;
      }
    }
  }
  return count;
}

// Rule 7: Tactical Evolutionary Movement Heuristics
function calculateTacticalMove(r, c, cell) {
  let bestDr = 0;
  let bestDc = 0;
  let bestScore = -Infinity;

  // Evaluate all 8 surrounding possible step directions (+ staying put)
  const options = [
    { dr: 0, dc: 0 }, { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
    { dr: 0, dc: -1 }, { dr: 0, dc: 1 }, { dr: -1, dc: -1 },
    { dr: -1, dc: 1 }, { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
  ];

  for (let opt of options) {
    let nr = r + opt.dr;
    let nc = c + opt.dc;

    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
    if (opt.dr !== 0 || opt.dc !== 0) {
      if (grid[nr][nc] !== null) continue; // Target tile blocked
    }

    let score = 0;
    let neighborsAtTarget = 0;
    let nearbyPredators = 0;

    // Scan 3x3 area around potential target tile
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        let checkR = nr + dr, checkC = nc + dc;
        if (checkR >= 0 && checkR < ROWS && checkC >= 0 && checkC < COLS) {
          let neighborCell = grid[checkR][checkC];
          if (neighborCell) {
            neighborsAtTarget++;
            if (neighborCell.role === 'predator') nearbyPredators++;
          }
        }
      }
    }

    if (cell.role === 'prey') {
      // 1. FLEE PREDATORS: High penalty for being near predators
      if (nearbyPredators > 0) score -= 100 * nearbyPredators;

      // 2. AVOID OVERCROWDING: Penalty if target spot would cause 4+ neighbor death
      if (neighborsAtTarget >= 4) score -= 50;

      // 3. ESCAPE ISOLATION: Reward moving toward other cells if currently isolated
      if (neighborsAtTarget === 0) score -= 20; // Isolated spot penalty
      else if (neighborsAtTarget >= 1 && neighborsAtTarget <= 3) score += 30; // Optimal herd size
    } 
    else if (cell.role === 'predator') {
      // Predators seek out prey and avoid starving
      let nearbyPrey = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          let checkR = nr + dr, checkC = nc + dc;
          if (checkR >= 0 && checkR < ROWS && checkC >= 0 && checkC < COLS) {
            let neighborCell = grid[checkR][checkC];
            if (neighborCell && neighborCell.role === 'prey') nearbyPrey++;
          }
        }
      }
      score += nearbyPrey * 40;
    }

    if (score > bestScore) {
      bestScore = score;
      bestDr = opt.dr;
      bestDc = opt.dc;
    }
  }

  return [bestDr, bestDc];
}

function updateWorld() {
  if (isPaused) return;

  // STEP 1: Process Births, Overcrowding, Isolation, and Aging
  let survivingGrid = createGrid();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let currentCell = grid[r][c];

      if (currentCell) {
        let neighborCount = getNeighborCount(r, c);

        // Rule 3: STRICT Overcrowding Check (4+ neighbors dies)
        if (neighborCount >= 4) continue; 

        // Rule 4: Isolation Pair Check
        if (neighborCount === 1) {
          let isPairIsolated = false;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              let nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc]) {
                if (getNeighborCount(nr, nc) === 1) isPairIsolated = true;
              }
            }
          }
          if (isPairIsolated) continue; 
        }

        // Rule 9: Predator Starvation (Max 30 moves)
        if (currentCell.role === 'predator') {
          currentCell.stepsSinceEaten++;
          if (currentCell.stepsSinceEaten >= 30) continue;
        }

        // Rule 6: Lifecycle Transitions
        if (generation % 20 === 0 && currentCell.age < 2) {
          currentCell.age++;
        }

        survivingGrid[r][c] = currentCell;

      } else {
        // Rule 2: Reproduction on exact horizontal 1-tile gap
        if (c > 0 && c < COLS - 1) {
          let left = grid[r][c - 1];
          let right = grid[r][c + 1];

          if (left && right && left.role === 'prey' && right.role === 'prey') {
            // Rule 8: Recombine parent ATGC DNA with point mutation chance
            let childGenome = left.genome.map((seq, i) => {
              let chosen = Math.random() > 0.5 ? seq : right.genome[i];
              if (Math.random() < 0.01) {
                let bases = ['A', 'T', 'G', 'C'];
                let pos = Math.floor(Math.random() * 4);
                return chosen.substring(0, pos) + bases[Math.floor(Math.random() * 4)] + chosen.substring(pos + 1);
              }
              return chosen;
            });
            survivingGrid[r][c] = new Cell('prey', childGenome);
          }
        }
      }
    }
  }

  // STEP 2: Process Rule 7 Tactical Evolutionary Movement
  let nextGrid = createGrid();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let cell = survivingGrid[r][c];
      if (!cell) continue;

      let moved = false;
      let [dr, dc] = calculateTacticalMove(r, c, cell);
      let nr = r + dr;
      let nc = c + dc;

      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        let target = survivingGrid[nr][nc];
        
        // Rule 9: Predator eating prey
        if (cell.role === 'predator' && target && target.role === 'prey') {
          cell.stepsSinceEaten = 0;
          nextGrid[nr][nc] = cell;
          survivingGrid[nr][nc] = null; 
          moved = true;
        } 
        // Move to empty grid slot
        else if (!target && !nextGrid[nr][nc]) {
          nextGrid[nr][nc] = cell;
          moved = true;
        }
      }

      if (!moved) {
        if (!nextGrid[r][c]) {
          nextGrid[r][c] = cell;
        }
      }
    }
  }

  grid = nextGrid;
  generation++;
  render();
}

function render() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  let prey = 0;
  let pred = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let cell = grid[r][c];
      if (cell) {
        ctx.fillStyle = cell.getColor();
        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
        if (cell.role === 'prey') prey++;
        if (cell.role === 'predator') pred++;
      }
    }
  }

  document.getElementById('genCount').innerText = generation;
  document.getElementById('preyCount').innerText = prey;
  document.getElementById('predCount').innerText = pred;
}

function placeCell(event) {
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const c = Math.floor(x / CELL_SIZE);
  const r = Math.floor(y / CELL_SIZE);

  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
    const role = document.getElementById('spawnType').value;
    grid[r][c] = new Cell(role);
    render();
  }
}

canvas.addEventListener('mousedown', (e) => {
  isMouseDown = true;
  placeCell(e);
});

canvas.addEventListener('mousemove', (e) => {
  if (isMouseDown) placeCell(e);
});

window.addEventListener('mouseup', () => {
  isMouseDown = false;
});

function togglePause() {
  isPaused = !isPaused;
  document.getElementById('pauseBtn').innerText = isPaused ? 'Resume' : 'Pause';
}

function clearGrid() {
  grid = createGrid();
  generation = 0;
  render();
}

render();
setInterval(updateWorld, 100);
</script>

</body>
</html>
